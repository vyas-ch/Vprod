# HTTPS wordt geactiveerd zodra DNS naar deze VPS verwijst.
server {
    listen 80;
    listen [::]:80;
    server_name vprod.nl www.vprod.nl 37.97.129.7;
    root /srv/vprod/current/public;
    index index.html;
    server_tokens off;
    autoindex off;
    charset utf-8;
    client_max_body_size 16k;
    expires -1;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    access_log off;
    error_log /var/log/nginx/vprod-error.log warn;

    location / { try_files $uri $uri/ =404; }
    location /assets/ { expires 1d; try_files $uri =404; }
    location ~ /\. { deny all; }
}

server {
    listen 80;
    listen [::]:80;
    server_name vproduction.nl www.vproduction.nl;
    server_tokens off;
    access_log off;
    return 301 http://vprod.nl$request_uri;
}
