server {
    listen 80;
    listen [::]:80;
    server_name vprod.nl www.vprod.nl vproduction.nl www.vproduction.nl 37.97.129.7;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://vprod.nl$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vprod.nl;
    ssl_certificate /etc/letsencrypt/live/vprod.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vprod.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VPROD:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/vprod/current/public;
    index index.html;
    server_tokens off;
    autoindex off;
    charset utf-8;
    client_max_body_size 16k;
    expires -1;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    access_log off;
    error_log /var/log/nginx/vprod-error.log warn;
    location / { try_files $uri $uri/ =404; }
    location /assets/ { expires 1d; try_files $uri =404; }
    location ~ /\. { deny all; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vprod.nl vproduction.nl www.vproduction.nl;
    ssl_certificate /etc/letsencrypt/live/vprod.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vprod.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VPROD:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    return 301 https://vprod.nl$request_uri;
}
