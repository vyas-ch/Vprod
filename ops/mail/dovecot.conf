# Standalone /etc/dovecot/dovecot.conf for Ubuntu 26.04 / Dovecot 2.4.2.
# No conf.d includes: do not inherit distribution PAM/system-user auth.
# Prerequisites: vmail user/group, postfix package user/group, actual TLS files,
# and /etc/dovecot/users containing ONLY the intended virtual account.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp
listen = *, ::
hostname = mail.vprod.nl
postmaster_address = info@vprod.nl

ssl = required
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = /etc/letsencrypt/live/mail.vprod.nl/fullchain.pem
ssl_server_key_file = /etc/letsencrypt/live/mail.vprod.nl/privkey.pem
auth_allow_cleartext = no
auth_mechanisms = plain login
# Keep the domain: short 'info' and other-domain identities must not match.
auth_username_format = %{user | lower}
auth_cache_size = 0

passdb passwd-file {
  default_password_scheme = SHA512-CRYPT
  passwd_file_path = /etc/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  fields {
    uid = vmail
    gid = vmail
    home = /var/vmail/vprod.nl/info-home
  }
}

# Maildir itself is exactly /var/vmail/vprod.nl/info (cur/new/tmp).
# The separate home avoids mixing home metadata with the Maildir namespace.
mail_driver = maildir
mail_path = /var/vmail/vprod.nl/info
mail_max_userip_connections = 8

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
}

# Small-mailbox concurrency limits, not a guarantee of total RAM consumption.
# Keep the normal secure process-per-login model.
default_process_limit = 16
default_client_limit = 128
service imap-login {
  process_min_avail = 0
  process_limit = 12
  client_limit = 1
  restart_request_count = 1
  vsz_limit = 128M
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service imap {
  process_limit = 12
  client_limit = 1
  vsz_limit = 256M
}
service auth {
  process_limit = 1
  client_limit = 64
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
    group = vmail
  }
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service auth-worker {
  user = dovecot
  process_limit = 2
  client_limit = 1
  vsz_limit = 128M
}
service lmtp {
  # Single vmail UID means LMTP can run without root privileges.
  user = vmail
  process_min_avail = 0
  process_limit = 2
  client_limit = 1
  vsz_limit = 128M
  unix_listener lmtp {
    mode = 0
  }
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service indexer-worker {
  process_limit = 1
  vsz_limit = 128M
}

protocol lmtp {
  # Postfix validates recipients before queueing via an exact recipient map.
  lmtp_rcpt_check_quota = no
}
