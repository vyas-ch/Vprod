name: Website checks
on:
  push:
    branches: [main, codex/website-concept-1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm run check && npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check public release archive
        run: |
          git archive --format=tar HEAD public > /tmp/vprod-public.tar
          python3 ops/auto-deploy.py --validate /tmp/vprod-public.tar
          bash -n ops/setup-vps.sh ops/deploy-vps.sh ops/install-auto-deploy.sh

